<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeptideTracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #0A0A0F; 
            color: #fff;
            min-height: 100vh;
        }
        .app { max-width: 480px; margin: 0 auto; }
        .header { padding: 20px; text-align: center; border-bottom: 1px solid #1E1E2E; }
        .main { padding: 20px; padding-bottom: 100px; }
        .nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; 
            background: #1E1E2E; padding: 12px 0; border-top: 1px solid #333;
            max-width: 480px; margin: 0 auto;
        }
        .nav button { background: transparent; border: none; color: #888; font-size: 11px; padding: 4px 8px; }
        .nav button.active { color: #6366F1; }
        .tab { display: none; }
        .tab.active { display: block; }
        .card { background: #1E1E2E; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .btn { padding: 12px 20px; background: #6366F1; border: none; border-radius: 8px; color: white; cursor: pointer; }
        .btn-secondary { background: #333; }
        .btn-small { padding: 8px 16px; font-size: 14px; }
        input, select, textarea { 
            width: 100%; padding: 12px; background: #0A0A0F; 
            border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 12px;
        }
        .empty { text-align: center; padding: 40px; color: #888; }
        .day-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .day-btn { 
            padding: 8px 12px; background: #0A0A0F; border: 1px solid #333; 
            border-radius: 6px; color: #888; cursor: pointer; font-size: 12px;
        }
        .day-btn.selected { background: #6366F1; color: white; border-color: #6366F1; }
        .schedule-type { margin-bottom: 16px; }
        .schedule-type label { display: block; margin-bottom: 8px; color: #888; font-size: 14px; }
        .next-dose { color: #22C55E; font-size: 12px; margin-top: 4px; }
        .next-dose.overdue { color: #F97316; }
        /* Color-blind friendly: Blue circle for logged, Yellow diamond for scheduled */
        .dose-marker { display: inline-block; margin: 0 2px; }
        .dose-marker.logged { 
            width: 8px; height: 8px; background: #3B82F6; border-radius: 50%; 
        }
        .dose-marker.scheduled { 
            width: 8px; height: 8px; background: #EAB308; transform: rotate(45deg);
        }
        .calendar-day { 
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            width: 14%; min-height: 50px; text-align: center; padding: 4px 0; 
            font-size: 12px; background: #0A0A0F; border-radius: 8px; margin: 2px 0;
            cursor: pointer; position: relative;
        }
        .calendar-day:hover { background: #252535; }
        .calendar-day.today { border: 2px solid #6366F1; }
        .calendar-day.empty { background: transparent; cursor: default; }
        .calendar-day-name { color: #888; font-size: 10px; width: 14%; text-align: center; padding: 8px 0; }
        .calendar-grid { display: flex; flex-wrap: wrap; background: #1E1E2E; border-radius: 12px; padding: 8px; }
        .modal { 
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: flex-end;
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: #1E1E2E; border-radius: 20px 20px 0 0; padding: 24px; 
            width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
        }
        .modal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #333;
        }
        .dose-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #333;
        }
        .cycle-input { 
            display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
        }
        .cycle-input input { width: 80px; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header"><h1>🧬 PeptideTracker</h1></header>
        
        <main class="main">
            <!-- Home Tab -->
            <div id="tab-home" class="tab active">
                <h2>Dashboard</h2>
                <div id="home-content"></div>
            </div>
            
            <!-- Log Tab -->
            <div id="tab-log" class="tab">
                <h2>Dose History</h2>
                <div id="log-content"></div>
            </div>
            
            <!-- Calendar Tab -->
            <div id="tab-calendar" class="tab">
                <h2>Calendar</h2>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <button class="btn btn-secondary" onclick="prevMonth()">←</button>
                    <h3 id="calendar-month"></h3>
                    <button class="btn btn-secondary" onclick="nextMonth()">→</button>
                </div>
                <div id="calendar-days-header" style="display: flex; margin-bottom: 8px;"></div>
                <div class="calendar-grid" id="calendar-grid"></div>
                <div style="margin-top: 16px; display: flex; gap: 20px; justify-content: center;">
                    <span><span class="dose-marker logged"></span> Taken (Blue)</span>
                    <span><span class="dose-marker scheduled" style="display: inline-block;"></span> Scheduled (Yellow)</span>
                </div>
                <p style="text-align: center; color: #888; font-size: 12px; margin-top: 8px;">Tap any day to view/schedule doses</p>
            </div>
            
            <!-- Library Tab -->
            <div id="tab-library" class="tab">
                <h2>Library</h2>
                <button class="btn" onclick="showAddForm()">+ Add Peptide</button>
                
                <div id="add-form" style="display:none; margin-top: 16px;">
                    <input type="text" id="new-name" placeholder="Peptide name">
                    <input type="number" id="new-dose" placeholder="Dose (mg)">
                    
                    <div class="schedule-type">
                        <label>Schedule Type:</label>
                        <select id="new-schedule-type" onchange="updateScheduleUI()">
                            <option value="interval">Every X Days</option>
                            <option value="days">Specific Days of Week</option>
                        </select>
                    </div>
                    
                    <div id="interval-input">
                        <input type="number" id="new-interval" placeholder="Every X days" value="1" min="1">
                    </div>
                    
                    <div id="days-input" style="display:none;">
                        <label style="color: #888; font-size: 14px; display: block; margin-bottom: 8px;">Select Days:</label>
                        <div class="day-selector">
                            <button type="button" class="day-btn" data-day="0" onclick="toggleDay(this)">Sun</button>
                            <button type="button" class="day-btn" data-day="1" onclick="toggleDay(this)">Mon</button>
                            <button type="button" class="day-btn" data-day="2" onclick="toggleDay(this)">Tue</button>
                            <button type="button" class="day-btn" data-day="3" onclick="toggleDay(this)">Wed</button>
                            <button type="button" class="day-btn" data-day="4" onclick="toggleDay(this)">Thu</button>
                            <button type="button" class="day-btn" data-day="5" onclick="toggleDay(this)">Fri</button>
                            <button type="button" class="day-btn" data-day="6" onclick="toggleDay(this)">Sat</button>
                        </div>
                    </div>
                    
                    <div class="schedule-type">
                        <label>Cycle (Optional):</label>
                        <div class="cycle-input">
                            <input type="number" id="new-cycle-on" placeholder="On" min="1">
                            <span>days ON</span>
                        </div>
                        <div class="cycle-input">
                            <input type="number" id="new-cycle-off" placeholder="Off" min="1">
                            <span>days OFF</span>
                        </div>
                        <p style="color: #666; font-size: 12px;">Leave blank for no cycle (always on)</p>
                    </div>
                    
                    <button class="btn" onclick="addPeptide()">Save Peptide</button>
                    <button class="btn btn-secondary" onclick="hideAddForm()" style="margin-left: 8px;">Cancel</button>
                </div>
                
                <div id="edit-form" style="display:none; margin-top: 16px;">
                    <h3 style="margin-bottom: 16px; color: #6366F1;">Edit Peptide</h3>
                    <input type="hidden" id="edit-id">
                    <input type="text" id="edit-name" placeholder="Peptide name">
                    <input type="number" id="edit-dose" placeholder="Dose (mg)">
                    
                    <div class="schedule-type">
                        <label>Schedule Type:</label>
                        <select id="edit-schedule-type" onchange="updateEditScheduleUI()">
                            <option value="interval">Every X Days</option>
                            <option value="days">Specific Days of Week</option>
                        </select>
                    </div>
                    
                    <div id="edit-interval-input">
                        <input type="number" id="edit-interval" placeholder="Every X days" min="1">
                    </div>
                    
                    <div id="edit-days-input" style="display:none;">
                        <label style="color: #888; font-size: 14px; display: block; margin-bottom: 8px;">Select Days:</label>
                        <div class="day-selector" id="edit-day-selector">
                            <button type="button" class="day-btn" data-day="0" onclick="toggleEditDay(this)">Sun</button>
                            <button type="button" class="day-btn" data-day="1" onclick="toggleEditDay(this)">Mon</button>
                            <button type="button" class="day-btn" data-day="2" onclick="toggleEditDay(this)">Tue</button>
                            <button type="button" class="day-btn" data-day="3" onclick="toggleEditDay(this)">Wed</button>
                            <button type="button" class="day-btn" data-day="4" onclick="toggleEditDay(this)">Thu</button>
                            <button type="button" class="day-btn" data-day="5" onclick="toggleEditDay(this)">Fri</button>
                            <button type="button" class="day-btn" data-day="6" onclick="toggleEditDay(this)">Sat</button>
                        </div>
                    </div>
                    
                    <div class="schedule-type">
                        <label>Cycle (Optional):</label>
                        <div class="cycle-input">
                            <input type="number" id="edit-cycle-on" placeholder="On" min="1">
                            <span>days ON</span>
                        </div>
                        <div class="cycle-input">
                            <input type="number" id="edit-cycle-off" placeholder="Off" min="1">
                            <span>days OFF</span>
                        </div>
                        <p style="color: #666; font-size: 12px;">Leave blank for no cycle</p>
                    </div>
                    
                    <button class="btn" onclick="updatePeptide()">Update Peptide</button>
                    <button class="btn btn-secondary" onclick="hideEditForm()" style="margin-left: 8px;">Cancel</button>
                </div>
                
                <div id="library-content" style="margin-top: 16px;"></div>
            </div>
            
            <!-- Settings Tab -->
            <div id="tab-settings" class="tab">
                <h2>Settings</h2>
                <div class="card">
                    <p>Peptides: <span id="settings-count">0</span></p>
                    <p>Doses Logged: <span id="settings-doses">0</span></p>
                    <button class="btn" onclick="clearData()" style="background: #EF4444; margin-top: 12px;">Clear All Data</button>
                </div>
            </div>
        </main>
        
        <nav class="nav">
            <button class="active" onclick="switchTab('home')">🏠 Home</button>
            <button onclick="switchTab('log')">📋 Log</button>
            <button onclick="switchTab('calendar')">📅 Cal</button>
            <button onclick="switchTab('library')">📚 Lib</button>
            <button onclick="switchTab('settings')">⚙️</button>
        </nav>
    </div>
    
    <!-- Day Modal -->
    <div id="day-modal" class="modal" onclick="if(event.target === this) closeDayModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date-title"></h3>
                <button onclick="closeDayModal()" style="background: transparent; border: none; color: #888; font-size: 24px;">×</button>
            </div>
            <div id="modal-doses"></div>
        </div>
    </div>

    <script>
        let peptides = [];
        let doseLogs = [];
        let currentMonth = new Date();
        let selectedDays = [];
        let editSelectedDays = [];
        let selectedDate = null;
        
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                           'July', 'August', 'September', 'October', 'November', 'December'];
        
        // Load data
        try {
            const saved = localStorage.getItem('peptide-tracker-data-v2');
            if (saved) {
                const data = JSON.parse(saved);
                peptides = data.peptides || [];
                doseLogs = data.doseLogs || [];
            } else {
                // Migrate from old storage
                const oldSaved = localStorage.getItem('peptide-tracker-data');
                if (oldSaved) {
                    const oldData = JSON.parse(oldSaved);
                    peptides = (oldData.peptides || []).map(p => ({
                        ...p,
                        cycle: p.cycle || null
                    }));
                    doseLogs = oldData.doseLogs || [];
                }
            }
        } catch (e) {
            console.log('No saved data');
        }
        
        function saveData() {
            localStorage.setItem('peptide-tracker-data-v2', JSON.stringify({ peptides, doseLogs }));
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'calendar') renderCalendar();
            else render();
        }
        
        function updateScheduleUI() {
            const type = document.getElementById('new-schedule-type').value;
            document.getElementById('interval-input').style.display = type === 'interval' ? 'block' : 'none';
            document.getElementById('days-input').style.display = type === 'days' ? 'block' : 'none';
        }
        
        function updateEditScheduleUI() {
            const type = document.getElementById('edit-schedule-type').value;
            document.getElementById('edit-interval-input').style.display = type === 'interval' ? 'block' : 'none';
            document.getElementById('edit-days-input').style.display = type === 'days' ? 'block' : 'none';
        }
        
        function toggleDay(btn) {
            const day = parseInt(btn.dataset.day);
            btn.classList.toggle('selected');
            if (selectedDays.includes(day)) {
                selectedDays = selectedDays.filter(d => d !== day);
            } else {
                selectedDays.push(day);
            }
            selectedDays.sort();
        }
        
        function toggleEditDay(btn) {
            const day = parseInt(btn.dataset.day);
            btn.classList.toggle('selected');
            if (editSelectedDays.includes(day)) {
                editSelectedDays = editSelectedDays.filter(d => d !== day);
            } else {
                editSelectedDays.push(day);
            }
            editSelectedDays.sort();
        }
        
        function showAddForm() {
            document.getElementById('add-form').style.display = 'block';
            document.getElementById('edit-form').style.display = 'none';
            selectedDays = [];
            document.querySelectorAll('#add-form .day-btn').forEach(b => b.classList.remove('selected'));
        }
        
        function hideAddForm() {
            document.getElementById('add-form').style.display = 'none';
            document.getElementById('new-name').value = '';
            document.getElementById('new-dose').value = '';
            document.getElementById('new-interval').value = '1';
            document.getElementById('new-cycle-on').value = '';
            document.getElementById('new-cycle-off').value = '';
            selectedDays = [];
            document.querySelectorAll('#add-form .day-btn').forEach(b => b.classList.remove('selected'));
        }
        
        function showEditForm(id) {
            const p = peptides.find(x => x.id === id);
            if (!p) return;
            
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-dose').value = p.dose;
            document.getElementById('edit-schedule-type').value = p.schedule.type;
            
            if (p.schedule.type === 'interval') {
                document.getElementById('edit-interval').value = p.schedule.days;
            } else {
                editSelectedDays = [...p.schedule.days];
                document.querySelectorAll('#edit-day-selector .day-btn').forEach(btn => {
                    const day = parseInt(btn.dataset.day);
                    if (editSelectedDays.includes(day)) btn.classList.add('selected');
                    else btn.classList.remove('selected');
                });
            }
            
            if (p.cycle) {
                document.getElementById('edit-cycle-on').value = p.cycle.onDays;
                document.getElementById('edit-cycle-off').value = p.cycle.offDays;
            } else {
                document.getElementById('edit-cycle-on').value = '';
                document.getElementById('edit-cycle-off').value = '';
            }
            
            updateEditScheduleUI();
            document.getElementById('edit-form').style.display = 'block';
            document.getElementById('add-form').style.display = 'none';
        }
        
        function hideEditForm() {
            document.getElementById('edit-form').style.display = 'none';
            editSelectedDays = [];
            document.querySelectorAll('#edit-day-selector .day-btn').forEach(b => b.classList.remove('selected'));
        }
        
        function addPeptide() {
            const name = document.getElementById('new-name').value.trim();
            const dose = parseFloat(document.getElementById('new-dose').value) || 0;
            const scheduleType = document.getElementById('new-schedule-type').value;
            const cycleOn = parseInt(document.getElementById('new-cycle-on').value);
            const cycleOff = parseInt(document.getElementById('new-cycle-off').value);
            
            if (!name) {
                alert('Please enter a peptide name');
                return;
            }
            
            let schedule;
            if (scheduleType === 'interval') {
                const interval = parseInt(document.getElementById('new-interval').value) || 1;
                schedule = { type: 'interval', days: interval };
            } else {
                if (selectedDays.length === 0) {
                    alert('Please select at least one day');
                    return;
                }
                schedule = { type: 'days', days: selectedDays };
            }
            
            let cycle = null;
            if (cycleOn && cycleOff) {
                cycle = { onDays: cycleOn, offDays: cycleOff, startDate: new Date().toISOString() };
            }
            
            peptides.push({ 
                id: Date.now().toString(), 
                name, 
                dose, 
                schedule,
                cycle,
                lastDose: null
            });
            saveData();
            hideAddForm();
            render();
        }
        
        function updatePeptide() {
            const id = document.getElementById('edit-id').value;
            const p = peptides.find(x => x.id === id);
            if (!p) return;
            
            p.name = document.getElementById('edit-name').value.trim();
            p.dose = parseFloat(document.getElementById('edit-dose').value) || 0;
            
            const scheduleType = document.getElementById('edit-schedule-type').value;
            if (scheduleType === 'interval') {
                p.schedule = { type: 'interval', days: parseInt(document.getElementById('edit-interval').value) || 1 };
            } else {
                if (editSelectedDays.length === 0) {
                    alert('Please select at least one day');
                    return;
                }
                p.schedule = { type: 'days', days: editSelectedDays };
            }
            
            const cycleOn = parseInt(document.getElementById('edit-cycle-on').value);
            const cycleOff = parseInt(document.getElementById('edit-cycle-off').value);
            if (cycleOn && cycleOff) {
                if (!p.cycle) p.cycle = { startDate: new Date().toISOString() };
                p.cycle.onDays = cycleOn;
                p.cycle.offDays = cycleOff;
            } else {
                p.cycle = null;
            }
            
            saveData();
            hideEditForm();
            render();
        }
        
        function deletePeptide(id) {
            if (!confirm('Delete this peptide?')) return;
            peptides = peptides.filter(p => p.id !== id);
            doseLogs = doseLogs.filter(l => l.peptideId !== id);
            saveData();
            render();
        }
        
        function deleteDose(id) {
            if (!confirm('Delete this dose?')) return;
            doseLogs = doseLogs.filter(l => l.id !== id);
            // Update lastDose for affected peptide
            peptides.forEach(p => {
                const remainingLogs = doseLogs.filter(l => l.peptideId === p.id);
                p.lastDose = remainingLogs.length > 0 ? remainingLogs[0].date : null;
            });
            saveData();
            render();
        }
        
        function logDose(id, date = null) {
            const p = peptides.find(x => x.id === id);
            if (!p) return;
            
            const doseDate = date || new Date().toISOString();
            p.lastDose = doseDate;
            doseLogs.unshift({
                id: Date.now().toString(),
                peptideId: id,
                dose: p.dose,
                date: doseDate
            });
            saveData();
            render();
            if (selectedDate) renderDayModal();
        }
        
        function isInCycle(peptide, date) {
            if (!peptide.cycle) return true;
            const startDate = new Date(peptide.cycle.startDate);
            startDate.setHours(0, 0, 0, 0);
            const checkDate = new Date(date);
            checkDate.setHours(0, 0, 0, 0);
            
            const totalCycleDays = peptide.cycle.onDays + peptide.cycle.offDays;
            const daysSinceStart = Math.floor((checkDate - startDate) / (1000 * 60 * 60 * 24));
            
            if (daysSinceStart < 0) return false;
            
            const dayInCycle = daysSinceStart % totalCycleDays;
            return dayInCycle < peptide.cycle.onDays;
        }
        
        function isScheduledForDate(peptide, date) {
            if (!isInCycle(peptide, date)) return false;
            
            if (peptide.schedule.type === 'interval') {
                // Use peptide creation as anchor date (stored in id as timestamp)
                const anchorDate = new Date(parseInt(peptide.id));
                anchorDate.setHours(0, 0, 0, 0);
                const checkDate = new Date(date);
                checkDate.setHours(0, 0, 0, 0);
                
                const diffDays = Math.floor((checkDate - anchorDate) / (1000 * 60 * 60 * 24));
                
                // Day 0 is first dose, then every X days after
                if (diffDays < 0) return false;
                return diffDays % peptide.schedule.days === 0;
            } else {
                return peptide.schedule.days.includes(date.getDay());
            }
        }
        
        function getScheduleText(peptide) {
            let text;
            if (peptide.schedule.type === 'interval') {
                text = `Every ${peptide.schedule.days} day${peptide.schedule.days > 1 ? 's' : ''}`;
            } else {
                text = peptide.schedule.days.map(d => dayNames[d]).join(', ');
            }
            if (peptide.cycle) {
                text += ` (${peptide.cycle.onDays}on/${peptide.cycle.offDays}off)`;
            }
            return text;
        }
        
        function getNextDose(peptide) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            if (peptide.schedule.type === 'interval') {
                if (!peptide.lastDose) return isInCycle(peptide, today) ? 'Today' : 'Check cycle';
                const lastDose = new Date(peptide.lastDose);
                lastDose.setHours(0, 0, 0, 0);
                
                let nextDose = new Date(lastDose);
                nextDose.setDate(lastDose.getDate() + peptide.schedule.days);
                
                // Skip off-cycle days
                while (!isInCycle(peptide, nextDose)) {
                    nextDose.setDate(nextDose.getDate() + 1);
                }
                
                const diffDays = Math.ceil((nextDose - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return '⚠️ Overdue!';
                if (diffDays === 0) return 'Today';
                return `In ${diffDays} day${diffDays > 1 ? 's' : ''}`;
            } else {
                // Specific days
                if (!isInCycle(peptide, today)) {
                    // Find next cycle start
                    const startDate = new Date(peptide.cycle.startDate);
                    const totalCycleDays = peptide.cycle.onDays + peptide.cycle.offDays;
                    const daysSinceStart = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
                    const currentCycle = Math.floor(daysSinceStart / totalCycleDays);
                    const nextCycleStart = new Date(startDate);
                    nextCycleStart.setDate(startDate.getDate() + (currentCycle + 1) * totalCycleDays);
                    const daysUntil = Math.ceil((nextCycleStart - today) / (1000 * 60 * 60 * 24));
                    return `Cycle off (${daysUntil} days)`;
                }
                
                const days = peptide.schedule.days.sort((a, b) => a - b);
                const todayDay = today.getDay();
                
                let nextDay = days.find(d => d > todayDay);
                if (nextDay === undefined) nextDay = days[0];
                
                let daysUntil = nextDay - todayDay;
                if (daysUntil <= 0) daysUntil += 7;
                
                const todayLogged = doseLogs.some(l => {
                    if (l.peptideId !== peptide.id) return false;
                    const logDate = new Date(l.date);
                    return logDate.toDateString() === today.toDateString();
                });
                
                if (daysUntil === 0 && todayLogged) return 'Done for today';
                if (daysUntil === 0) return 'Today';
                return `In ${daysUntil} day${daysUntil > 1 ? 's' : ''} (${dayNames[nextDay]})`;
            }
        }
        
        function render() {
            // Home
            const homeContent = document.getElementById('home-content');
            if (peptides.length === 0) {
                homeContent.innerHTML = '<div class="empty"><p>No peptides yet.</p><button class="btn" onclick="switchTab(\'library\')">Add Peptide</button></div>';
            } else {
                homeContent.innerHTML = peptides.map(p => {
                    const nextDose = getNextDose(p);
                    const isOverdue = nextDose.includes('Overdue');
                    return `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>${p.dose}mg • ${getScheduleText(p)}</p>
                        <p class="next-dose ${isOverdue ? 'overdue' : ''}">Next: ${nextDose}</p>
                        <button class="btn" onclick="logDose('${p.id}')" style="margin-top: 8px;">Log Dose</button>
                    </div>
                `}).join('');
            }
            
            // Log
            const logContent = document.getElementById('log-content');
            if (doseLogs.length === 0) {
                logContent.innerHTML = '<div class="empty"><p>No doses logged.</p></div>';
            } else {
                logContent.innerHTML = doseLogs.slice(0, 20).map(l => {
                    const p = peptides.find(x => x.id === l.peptideId);
                    return `<div class="card"><div style="display: flex; justify-content: space-between; align-items: center;"><div><span>${p ? p.name : 'Unknown'}</span> <span style="color: #6366F1;">${l.dose}mg</span></div><button onclick="deleteDose('${l.id}')" style="background: transparent; border: none; color: #EF4444; font-size: 18px; padding: 4px;">🗑️</button></div><div style="color: #888; font-size: 12px; margin-top: 4px;">${new Date(l.date).toLocaleString()}</div></div>`;
                }).join('');
            }
            
            // Library
            document.getElementById('library-content').innerHTML = peptides.map(p => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h3>${p.name}</h3>
                            <p>${p.dose}mg • ${getScheduleText(p)}</p>
                        </div>
                        <div>
                            <button onclick="showEditForm('${p.id}')" style="background: transparent; border: none; font-size: 18px; padding: 4px; margin-right: 8px;">✏️</button>
                            <button onclick="deletePeptide('${p.id}')" style="background: transparent; border: none; font-size: 18px; padding: 4px;">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Settings
            document.getElementById('settings-count').textContent = peptides.length;
            document.getElementById('settings-doses').textContent = doseLogs.length;
        }
        
        function renderCalendar() {
            document.getElementById('calendar-month').textContent = 
                monthNames[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();
            
            // Day headers
            const headerHtml = dayNames.map(d => `<div class="calendar-day-name">${d}</div>`).join('');
            document.getElementById('calendar-days-header').innerHTML = headerHtml;
            
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            let html = '';
            // Empty cells
            for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === today.toDateString();
                
                const dayLogs = doseLogs.filter(l => {
                    const d = new Date(l.date);
                    return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
                });
                
                const scheduled = peptides.filter(p => isScheduledForDate(p, date));
                const loggedPeptideIds = new Set(dayLogs.map(l => l.peptideId));
                const pending = scheduled.filter(p => !loggedPeptideIds.has(p.id));
                
                let markers = '';
                dayLogs.forEach(() => markers += '<span class="dose-marker logged"></span>');
                pending.forEach(() => markers += '<span class="dose-marker scheduled"></span>');
                
                html += `<div class="calendar-day ${isToday ? 'today' : ''}" onclick="openDayModal(${year}, ${month}, ${day})">${day}<div style="margin-top: 2px;">${markers}</div></div>`;
            }
            
            document.getElementById('calendar-grid').innerHTML = html;
        }
        
        function openDayModal(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderDayModal();
            document.getElementById('day-modal').classList.add('active');
        }
        
        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('active');
            selectedDate = null;
        }
        
        function renderDayModal() {
            if (!selectedDate) return;
            
            document.getElementById('modal-date-title').textContent = selectedDate.toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            
            const dayLogs = doseLogs.filter(l => {
                const d = new Date(l.date);
                return d.toDateString() === selectedDate.toDateString();
            });
            
            const scheduled = peptides.filter(p => isScheduledForDate(p, selectedDate));
            const loggedPeptideIds = new Set(dayLogs.map(l => l.peptideId));
            const pending = scheduled.filter(p => !loggedPeptideIds.has(p.id));
            
            let html = '';
            
            // Logged doses
            if (dayLogs.length > 0) {
                html += '<h4 style="margin-bottom: 12px; color: #3B82F6;">✓ Taken</h4>';
                dayLogs.forEach(l => {
                    const p = peptides.find(x => x.id === l.peptideId);
                    html += `<div class="dose-item"><span>${p ? p.name : 'Unknown'} - ${l.dose}mg</span><span style="color: #888; font-size: 12px;">${new Date(l.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>`;
                });
            }
            
            // Pending doses
            if (pending.length > 0) {
                html += '<h4 style="margin: 20px 0 12px; color: #EAB308;">Scheduled</h4>';
                pending.forEach(p => {
                    html += `<div class="dose-item"><span>${p.name} - ${p.dose}mg</span><button class="btn btn-small" onclick="logDose('${p.id}', '${selectedDate.toISOString()}')">Log</button></div>`;
                });
            }
            
            if (dayLogs.length === 0 && pending.length === 0) {
                html += '<p style="color: #888; text-align: center; padding: 40px;">No doses scheduled for this day</p>';
            }
            
            document.getElementById('modal-doses').innerHTML = html;
        }
        
        function prevMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        }
        
        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        }
        
        function clearData() {
            if (!confirm('Clear ALL data?')) return;
            peptides = [];
            doseLogs = [];
            localStorage.removeItem('peptide-tracker-data');
            localStorage.removeItem('peptide-tracker-data-v2');
            render();
        }
        
        // Initial render
        render();
    </script>
</body>
</html>
